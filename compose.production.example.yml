services:
  google-health-agent:
    build: .
    environment:
      APP_ENV: production
      HEALTH_PROVIDER: google
      DATABASE_URL: ${DATABASE_URL}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_AUTH_ENABLED: "true"
      HEALTH_MCP_TOKEN: ${HEALTH_MCP_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY}
      MAILER: ${MAILER}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_TO: ${MAIL_TO}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - encrypted-credentials:/app/credentials

volumes:
  encrypted-credentials:

