[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-health-agent"
version = "0.1.0"
description = "Self-hosted Google Health data service for AI agent analysis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Google Health Agent contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=44,<47",
  "httpx>=0.28,<1",
  "mcp>=1.26,<2",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
healthctl = "google_health_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/google_health_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["google_health_agent"]
exclude = ["alembic"]
plugins = ["pydantic.mypy"]

